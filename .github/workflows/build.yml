name: Build

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    -
      name: Set env
      run: |
        echo "GO_VERSION=$(grep '^go' go.mod | awk '{print $2}')" >> $GITHUB_ENV
    -
      name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    -
      name: Vet
      run: go vet ./...
    -
      name: Build
      run: go build ./...
    -
      name: Unit tests
      run: go test -race -cover ./...
    -
      name: Integration tests compile-check
      run: go vet -tags=integration ./...
